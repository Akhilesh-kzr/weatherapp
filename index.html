
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <header>
            <div>
                <h1>☁ Weather Dashboard</h1>
                <p>Check the weather anywhere in the world</p>
            </div>

            <button id="themeBtn">🌙 Dark</button>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >
            <button id="searchBtn">Search Weather</button>
        </section>

        <p id="errorMsg" class="error"></p>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading weather...</p>
        </div>

        <main id="weatherContent" hidden>

            <section id="weatherCard" class="weather-card"></section>

            <section class="forecast-section">
                <h2>5-Day Forecast</h2>
                <div id="forecastList" class="forecast-list"></div>
            </section>

            <section class="favorites-section">
                <h2>⭐ Favorite Cities</h2>
                <div id="favoritesList" class="favorites-list"></div>
            </section>

        </main>

        <div id="welcome">
            <h2>🌤 Welcome!</h2>
            <p>Search for a city to see its weather information.</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
